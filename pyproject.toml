# Not a Python package: this file pins the tools that build the docs
# (`pip install .[docs]`, also on Read the Docs) and those that check the
# Python hooks (`pip install .[dev]`; see docs/contributing.md)
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lloping-llama"
version = "0.1.0"
description = "Docs build of the lloping-llama Claude Code plugin"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.6,<10",
]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6",
  "pyyaml>=6",
  "ruff>=0.8",
  "types-pyyaml>=6",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
src = ["hooks", "tests/hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "D", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# subprocess runs git with fixed arguments; tests use assert
"hooks/profile_gate.py" = ["S603", "S607"]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
files = ["hooks", "tests/hooks"]
mypy_path = "hooks"

[tool.pytest.ini_options]
testpaths = ["tests/hooks"]
pythonpath = ["hooks"]
addopts = "--cov=profile_gate --cov-branch --cov-report=term-missing --cov-fail-under=100"
