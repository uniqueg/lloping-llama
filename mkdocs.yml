site_name: lloping-llama
site_description: >-
  A Claude Code plugin for agent-assisted software and project work
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://lloping-llama.readthedocs.io/en/latest/"]
repo_url: https://github.com/uniqueg/lloping-llama
repo_name: uniqueg/lloping-llama
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Files included in pages (see `pymdownx.snippets`)
watch:
  - CONTRIBUTING.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Overlay guide: overlay.md
  - Rules and levels: rules.md
  - Profiles: profiles.md
  - Profile gate: profile-gate.md
  - Reviewers: reviewers.md
  - Messages: messages.md
  - Agent sweeper: sweeper.md
  - Reference: reference.md
  - Contributing: contributing.md
