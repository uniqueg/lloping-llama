# Lint Markdown, shell and PowerShell scripts; lint, type-check and test the
# sweeper (Python); validate the plugin and marketplace manifests; build the
# docs strictly; run the machine-file collectors on Linux, macOS and Windows.
# The gate job `passed` ("CI passed") is the only required check of this
# workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool versions; update them by hand (Dependabot doesn't see npx)
  MARKDOWNLINT_CLI2_VERSION: 0.24.0
  CLAUDE_CODE_VERSION: 2.1.318
  PSSCRIPTANALYZER_VERSION: 1.24.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
      - name: Lint shell scripts
        # shellcheck is preinstalled on GitHub's Ubuntu runners
        run: bash tests/lint-shell.sh
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          $results = git ls-files '*.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate the plugin manifest and components
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .
      - name: Validate the marketplace manifest
        run: >-
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          plugin validate --strict .claude-plugin/marketplace.json
      - name: Check that plugin and marketplace agree
        run: |
          jq -e --slurpfile p .claude-plugin/plugin.json \
            '.plugins | any(.name == $p[0].name and .source == "./")' \
            .claude-plugin/marketplace.json

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the docs tools
        run: pip install '.[docs]'
      - name: Build the docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

  sweeper:
    name: Sweeper (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: sweeper
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the dev tools
        run: pip install -e '.[test]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test (100 % coverage)
        run: pytest
      - name: Run the commands from bin/
        run: |
          root=$(mktemp -d)
          export AGENT_CLONES=$root
          ../bin/agent-ledger new example-1 --repo example-org/example-repo
          ../bin/agent-ledger show example-1
          ../bin/agent-sweep --dry-run --offline

  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the smoke tests of the shell scripts
        if: matrix.os == 'Linux'
        run: bash tests/smoke.sh
      # The collectors run with an editor path that holds the home path and
      # the user name, so that the identity check below tests the scrubbing
      - name: Run the machine-file collector (Linux)
        if: matrix.os == 'Linux'
        run: |
          c=templates/overlay/me/collect-machine/linux.sh
          EDITOR="$HOME/bin/$(id -un)-editor" bash "$c" >"$RUNNER_TEMP/machine.md" 2>"$RUNNER_TEMP/err"
          bash "$c" --with-identity >"$RUNNER_TEMP/identity.md"
      - name: Run the machine-file collector (macOS, zsh and sh)
        if: matrix.os == 'macOS'
        run: |
          c=templates/overlay/me/collect-machine/macos.sh
          EDITOR="$HOME/bin/$(id -un)-editor" zsh "$c" >"$RUNNER_TEMP/machine.md" 2>"$RUNNER_TEMP/err"
          EDITOR="$HOME/bin/$(id -un)-editor" sh "$c" >"$RUNNER_TEMP/machine-sh.md" 2>>"$RUNNER_TEMP/err"
          # Same output in both shells, apart from the date line and the
          # terminal (bash as sh sets TERM=dumb when it is unset)
          diff <(grep -vE '^(<!-- Generated|- Terminal:)' "$RUNNER_TEMP/machine.md") \
            <(grep -vE '^(<!-- Generated|- Terminal:)' "$RUNNER_TEMP/machine-sh.md")
          zsh "$c" --with-identity >"$RUNNER_TEMP/identity.md"
      - name: Run the machine-file collector (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          $c = 'templates/overlay/me/collect-machine/windows.ps1'
          $env:EDITOR = "$env:USERPROFILE\bin\$env:USERNAME-editor"
          & $c 2>"$env:RUNNER_TEMP/err" | Out-File -Encoding utf8 "$env:RUNNER_TEMP/machine.md"
          if (-not $?) { exit 1 }
          $env:EDITOR = $null
          & $c -WithIdentity | Out-File -Encoding utf8 "$env:RUNNER_TEMP/identity.md"
          if (-not $?) { exit 1 }
      - name: Check the output
        # A machine file with an OS line, at least one real tool version, no
        # error output and no identity (user name, home path, host name) of
        # the runner; with identity on request
        shell: bash
        run: |
          f="$RUNNER_TEMP/machine.md"
          cat "$f"
          grep -q '^- OS: ' "$f"
          grep -qE '^git +git version [0-9]' "$f"
          grep -q '^- Editor (VISUAL/EDITOR): ~' "$f"
          if [[ -s $RUNNER_TEMP/err ]]; then
            echo "::error::the collector wrote to stderr"
            cat "$RUNNER_TEMP/err"
            exit 1
          fi
          user=$(id -un 2>/dev/null || echo "${USERNAME:-}")
          [[ -n ${USERNAME:-} ]] && user=$USERNAME
          for s in "$user" "$HOME" "${USERPROFILE:-}" "$(hostname)"; do
            if [[ -n $s ]] && grep -qiF -- "$s" "$f"; then
              echo "::error::the machine file contains identity: $s"
              exit 1
            fi
          done
          grep -qiF -- "- User: $user" "$RUNNER_TEMP/identity.md"

  # The gate: the only required check of this workflow, a stable name
  # independent of the jobs and their matrices. Runs always and needs every
  # other job; passes only if all of them passed (no job is skipped on
  # purpose). Add new jobs to `needs`
  passed:
    name: CI passed
    if: always()
    needs:
      - lint
      - plugin
      - docs
      - sweeper
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
